<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Tusobola Kids Foundation | Masese, Jinja, Uganda</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600;700&display=swap');
:root{
  --orange:#F97316; --orange-light:#FED7AA; --orange-pale:#FFF7ED;
  --green:#16A34A; --green-dark:#14532D; --green-light:#BBF7D0; --green-pale:#F0FDF4;
  --blue:#2563EB; --blue-light:#BFDBFE; --blue-pale:#EFF6FF;
  --white:#FFFFFF; --off:#FAFAFA; --text:#111827; --mid:#4B5563; --light:#9CA3AF;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;color:var(--text);background:var(--white);}

/* ANNOUNCEMENT BAR */
.ann-bar{background:var(--orange);color:white;text-align:center;padding:0.6rem 1rem;font-size:0.82rem;font-weight:600;}
.ann-bar a{color:white;text-decoration:underline;margin-left:0.5rem;}

/* NAV */
nav{position:fixed;top:36px;left:0;right:0;z-index:1000;background:rgba(255,255,255,0.97);backdrop-filter:blur(10px);padding:0 5%;display:flex;align-items:center;justify-content:space-between;height:64px;box-shadow:0 2px 20px rgba(0,0,0,0.08);}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo img{width:42px;height:42px;border-radius:50%;object-fit:cover;}
.nav-logo span{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--green-dark);font-weight:700;}
.nav-links{display:flex;gap:1.5rem;list-style:none;align-items:center;}
.nav-links a{color:var(--mid);text-decoration:none;font-size:0.82rem;font-weight:500;transition:color 0.2s;}
.nav-links a:hover{color:var(--orange);}
.nav-sponsor{background:var(--orange);color:white!important;padding:0.45rem 1.2rem;border-radius:25px;font-weight:700!important;font-size:0.82rem!important;transition:all 0.2s!important;}
.nav-sponsor:hover{background:#EA580C;transform:translateY(-1px);}
